<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="COMO4U - Coming Soon to Columbia, Missouri">
    <title>COMO4U | Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Particle Canvas -->
    <canvas id="particles"></canvas>
    
    <!-- Main Content -->
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo">
                <span class="logo-como">COMO</span><span class="logo-4u">4U</span>
            </div>
            <div class="tagline">Columbia, Missouri</div>
        </div>

        <!-- Main Message -->
        <div class="message-section">
            <h1 class="main-title">
                <span class="title-line">Something Amazing</span>
                <span class="title-line highlight">Is Coming</span>
                <a href="chat.html">Chat COMO</a>
            </h1>
            <p class="subtitle" id="typewriter"></p>
        </div>

        <!-- Loading Animation -->
        <div class="loader-section">
            <div class="loader">
                <div class="loader-bar"></div>
            </div>
            <div class="loader-text">
                <span id="progress-text">Loading</span>
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </div>
        </div>

        <!-- Decorative Elements -->
        <div class="decorative-circles">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>

        <!-- Email Signup -->
        <div class="signup-section">
            <p class="signup-text">Get notified when we launch</p>
            <form class="signup-form" id="signup-form">
                <input type="email" placeholder="Enter your email" required id="email-input">
                <button type="submit" class="btn-notify">
                    <span>Notify Me</span>
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                    </svg>
                </button>
            </form>
            <div class="success-message" id="success-message">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                </svg>
                <span>Thanks! We'll keep you posted.</span>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social-section">
            <a href="#" class="social-link" aria-label="Facebook">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/>
                </svg>
            </a>
            <a href="#" class="social-link" aria-label="Twitter">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
            <a href="#" class="social-link" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M17.25,5.5A1.25,1.25 0 0,1 18.5,6.75A1.25,1.25 0 0,1 17.25,8A1.25,1.25 0 0,1 16,6.75A1.25,1.25 0 0,1 17.25,5.5M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z"/>
                </svg>
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 COMO4U. Made with ❤️ for Columbia, MO</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
